<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тетрис</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --space:      #111d2d;
  --space-deep: #08111d;
  --ink:        #14202b;
  --cream:      #fff5cf;
  --paper:      #f6e8bd;
  --red:        #d8422c;
  --gold:       #f3bc37;
  --cyan:       #55d8df;
  --pink:       #df5b9f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html,body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  font-family: 'Rubik', sans-serif; color: var(--cream);
  touch-action: none; overscroll-behavior: none; overflow: hidden;
  background-color: var(--space-deep);
  background-image:
    radial-gradient(circle at 8%  12%, #f6e8bd 0 1px,   transparent 1.8px),
    radial-gradient(circle at 82%  8%, #f3bc37 0 1.5px, transparent 2.2px),
    radial-gradient(circle at 13% 45%, #69dae0 0 1px,   transparent 1.8px),
    radial-gradient(circle at 91% 52%, #f6e8bd 0 1px,   transparent 1.8px),
    radial-gradient(circle at 25% 81%, #f3bc37 0 1.5px, transparent 2.2px),
    radial-gradient(circle at 72% 87%, #69dae0 0 1px,   transparent 1.8px),
    linear-gradient(165deg, #1b3546 0%, var(--space) 52%, var(--space-deep) 100%);
  background-size: 145px 155px, 177px 173px, 211px 218px,
                   189px 199px, 253px 239px, 181px 201px, auto;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.18;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.52'/%3E%3C/svg%3E");
}
.wrap { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 0 10px; z-index: 1; }
.icon-btn {
  position: fixed; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(20,32,43,0.88);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; z-index: 20;
  border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink), 0 6px 14px rgba(0,0,0,0.45);
  transition: transform 0.12s;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.back-btn  { top: 12px; left: 12px; }
.pause-btn { top: 12px; right: 12px; }
.hud {
  display: flex; justify-content: center; gap: 8px;
  padding: 12px 60px 4px; flex-wrap: wrap; flex: 0 0 auto;
}
.pill {
  background: var(--paper); color: var(--ink);
  font-family: 'Russo One', sans-serif; font-size: 12px;
  padding: 4px 12px; border-radius: 20px;
  border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  letter-spacing: 0.3px;
}
.main-row { flex: 1; display: flex; gap: 10px; align-items: center; justify-content: center; min-height: 0; }
.board-holder { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; height: 100%; }
canvas#board { display: block; box-shadow: 0 8px 0 var(--ink), 0 14px 30px rgba(0,0,0,0.5); border-radius: 6px; }
.side { display: flex; flex-direction: column; gap: 10px; align-items: center; flex: 0 0 auto; }
.next-label {
  font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 10px;
  color: rgba(255,245,207,0.6); letter-spacing: 1px; text-transform: uppercase;
}
canvas#next {
  background: rgba(20,32,43,0.72); border-radius: 10px;
  border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
}
.controls { display: flex; justify-content: center; gap: 8px; padding: 12px 0 16px; flex: 0 0 auto; }
.ctrl-btn {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 12px;
  font-size: 18px; color: var(--ink);
  width: 52px; height: 52px;
  box-shadow: 0 5px 0 var(--ink);
}
.ctrl-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.overlay { position: fixed; inset: 0; background: rgba(8,17,29,0.72); display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
.overlay.show { display: flex; }
.modal {
  background: var(--paper); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 12px 20px 13px 18px;
  padding: 26px 24px; text-align: center; max-width: 280px; width: 100%;
  box-shadow: 0 6px 0 var(--ink), 0 14px 30px rgba(0,0,0,0.5);
}
.modal h2 {
  font-family: 'Russo One', sans-serif; margin: 0 0 6px; font-size: 22px;
  color: var(--red); -webkit-text-stroke: 1px var(--ink);
  text-shadow: 2px 2px 0 rgba(20,32,43,0.25);
}
.modal p { font-weight: 600; color: #49515a; margin: 0 0 18px; font-size: 14px; }
.btn-main {
  background: var(--gold); border: 3px solid var(--ink); color: var(--ink);
  font-family: 'Russo One', sans-serif; font-size: 15px;
  padding: 11px 26px; border-radius: 10px 18px 11px 16px;
  box-shadow: 0 5px 0 var(--ink); cursor: pointer;
}
.btn-main:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<a class="icon-btn back-btn" href="index.html" aria-label="Назад">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M60 20 L32 50 L60 80" fill="none" stroke="var(--cream)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>
<button class="icon-btn pause-btn" id="pauseBtn" aria-label="Пауза">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="24" width="14" height="52" rx="4" fill="var(--cream)"/>
    <rect x="58" y="24" width="14" height="52" rx="4" fill="var(--cream)"/>
  </svg>
</button>
<div class="wrap">
  <div class="hud">
    <div class="pill" id="score">Очки: 0</div>
    <div class="pill" id="lines">Линии: 0</div>
    <div class="pill" id="level">Уровень: 1</div>
  </div>
  <div class="main-row">
    <div class="board-holder"><canvas id="board"></canvas></div>
    <div class="side">
      <span class="next-label">Дальше</span>
      <canvas id="next" width="70" height="70"></canvas>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="left">⬅️</button>
    <button class="ctrl-btn" id="rotate">🔄</button>
    <button class="ctrl-btn" id="down">⬇️</button>
    <button class="ctrl-btn" id="right">➡️</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Игра окончена 🧱</h2>
    <p id="finalScore">Очки: 0</p>
    <button class="btn-main" id="restart">Сыграть ещё</button>
  </div>
</div>
<script>
if(window.Telegram && window.Telegram.WebApp){
  const tg=window.Telegram.WebApp;
  tg.ready(); tg.expand();
  if(typeof tg.disableVerticalSwipes==='function') tg.disableVerticalSwipes();
}
const cols=10, rows=20;
let cell=22;
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const nextCanvas=document.getElementById('next');
const nctx=nextCanvas.getContext('2d');
const START_SPEED=900, MIN_SPEED=250, LINES_PER_LEVEL=5, SPEED_STEP=45;
const CLEAR_DELAY=140;
let grid, current, nextPiece, score, lines, level, alive, dropCounter, dropInterval, lastTime, flashRows, flashTimer, landFlash, landFlashTimer;
let locked=false;
function resizeCanvas(){
  const holder=document.querySelector('.board-holder');
  const availW=holder.clientWidth, availH=holder.clientHeight;
  cell=Math.floor(Math.min(availW/cols, availH/rows));
  const pxW=cell*cols, pxH=cell*rows;
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  canvas.style.width=pxW+'px'; canvas.style.height=pxH+'px';
  canvas.width=pxW*dpr; canvas.height=pxH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.borderRadius='8px';
}
window.addEventListener('resize', resizeCanvas);
const COLORS={ I:'#55d8df', J:'#4faec7', L:'#f3bc37', O:'#df5b9f', S:'#62bc76', T:'#a66da4', Z:'#d8422c' };
const SHAPES={
  I:[[1,1,1,1]], J:[[1,0,0],[1,1,1]], L:[[0,0,1],[1,1,1]],
  O:[[1,1],[1,1]], S:[[0,1,1],[1,1,0]], T:[[0,1,0],[1,1,1]], Z:[[1,1,0],[0,1,1]]
};
function emptyGrid(){ return Array.from({length:rows},()=>Array(cols).fill(null)); }
function randPiece(){
  const keys=Object.keys(SHAPES);
  const k=keys[Math.floor(Math.random()*keys.length)];
  return {key:k, shape:SHAPES[k].map(r=>r.slice()), color:COLORS[k]};
}
function newPiece(){
  const p = nextPiece || randPiece();
  nextPiece = randPiece();
  drawNext();
  return {shape:p.shape, color:p.color, x:Math.floor(cols/2)-Math.ceil(p.shape[0].length/2), y:0};
}
function rotate(matrix){
  const N=matrix.length, M=matrix[0].length;
  const res=Array.from({length:M},()=>Array(N).fill(0));
  for(let r=0;r<N;r++) for(let c=0;c<M;c++) res[c][N-1-r]=matrix[r][c];
  return res;
}
function collide(px,py,shape){
  for(let r=0;r<shape.length;r++){
    for(let c=0;c<shape[r].length;c++){
      if(!shape[r][c]) continue;
      const x=px+c, y=py+r;
      if(x<0||x>=cols||y>=rows) return true;
      if(y>=0 && grid[y][x]) return true;
    }
  }
  return false;
}
function ghostY(){
  let gy=current.y;
  while(!collide(current.x,gy+1,current.shape)) gy++;
  return gy;
}
function merge(){
  const {shape,color,x,y}=current;
  shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v && y+r>=0) grid[y+r][x+c]=color; }));
}
function clearLines(onDone){
  let full=[];
  for(let r=0;r<rows;r++) if(grid[r].every(v=>v)) full.push(r);
  if(!full.length){ onDone(); return; }
  flashRows=full; flashTimer=8;
  setTimeout(()=>{
    full.sort((a,b)=>a-b).forEach(r=>{ grid.splice(r,1); grid.unshift(Array(cols).fill(null)); });
    const points=[0,100,300,500,800][full.length]||1000;
    score+=points; lines+=full.length;
    level=Math.floor(lines/LINES_PER_LEVEL)+1;
    document.getElementById('score').textContent='Очки: '+score;
    document.getElementById('lines').textContent='Линии: '+lines;
    document.getElementById('level').textContent='Уровень: '+level;
    dropInterval=Math.max(MIN_SPEED, START_SPEED-(level-1)*SPEED_STEP);
    onDone();
  }, CLEAR_DELAY);
}
function spawnNext(){
  current=newPiece();
  if(collide(current.x,current.y,current.shape)) gameOver();
}
function drop(){
  if(paused || locked || !alive) return;
  if(!collide(current.x,current.y+1,current.shape)){
    current.y++;
  } else {
    landFlash=[]; current.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v) landFlash.push({x:current.x+c,y:current.y+r}); }));
    landFlashTimer=6;
    merge();
    locked=true;
    clearLines(()=>{ locked=false; if(alive) spawnNext(); });
  }
  dropCounter=0;
}
function move(dx){ if(paused||locked||!alive) return; if(!collide(current.x+dx,current.y,current.shape)) current.x+=dx; }
function doRotate(){
  if(paused||locked||!alive) return;
  const rotated=rotate(current.shape);
  const kicks=[0,-1,1,-2,2];
  for(const kick of kicks){
    if(!collide(current.x+kick,current.y,rotated)){ current.shape=rotated; current.x+=kick; return; }
  }
}
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}
function drawCell(c2,x,y,color,size){
  const grad=c2.createLinearGradient(x*size,y*size,x*size+size,y*size+size);
  grad.addColorStop(0, shade(color,35));
  grad.addColorStop(1, shade(color,-25));
  c2.fillStyle=grad;
  c2.fillRect(x*size+1,y*size+1,size-2,size-2);
  c2.strokeStyle='rgba(255,255,255,0.25)';
  c2.strokeRect(x*size+1.5,y*size+1.5,size-3,size-3);
}
function draw(){
  const pxW=cell*cols, pxH=cell*rows;
  ctx.clearRect(0,0,pxW,pxH);
  ctx.fillStyle='#111d2d'; ctx.fillRect(0,0,pxW,pxH);
  ctx.fillStyle='rgba(255,245,207,0.025)';
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if((r+c)%2===0) ctx.fillRect(c*cell,r*cell,cell,cell);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(grid[r][c]) drawCell(ctx,c,r,grid[r][c],cell);
  if(landFlashTimer>0){
    ctx.fillStyle=`rgba(255,245,207,${landFlashTimer/6*0.4})`;
    landFlash.forEach(p=> ctx.fillRect(p.x*cell,p.y*cell,cell,cell));
    landFlashTimer--;
  }
  if(flashTimer>0){
    ctx.fillStyle=`rgba(255,245,207,${flashTimer/8*0.7})`;
    flashRows.forEach(r=> ctx.fillRect(0,r*cell,pxW,cell));
    flashTimer--;
  }
  if(!locked && current){
    const gy=ghostY();
    ctx.globalAlpha=0.2;
    current.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v) drawCell(ctx,current.x+c,gy+r,current.color,cell); }));
    ctx.globalAlpha=1;
    current.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v) drawCell(ctx,current.x+c,current.y+r,current.color,cell); }));
  }
}
function drawNext(){
  nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
  nctx.fillStyle='rgba(20,32,43,0.72)'; nctx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
  if(!nextPiece) return;
  const size=16;
  const w=nextPiece.shape[0].length*size, h=nextPiece.shape.length*size;
  const ox=(nextCanvas.width-w)/2, oy=(nextCanvas.height-h)/2;
  nctx.save(); nctx.translate(ox,oy);
  nextPiece.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v) drawCell(nctx,c,r,nextPiece.color,size); }));
  nctx.restore();
}
function gameOver(){
  alive=false; locked=false;
  document.getElementById('finalScore').textContent='Очки: '+score;
  document.getElementById('overlay').classList.add('show');
}
let paused=false;
function loop(time){
  if(!alive) return;
  if(paused){ draw(); drawPauseOverlay(); return; }
  if(!lastTime) lastTime=time;
  let delta=time-lastTime; lastTime=time;
  if(delta>200) delta=200;
  if(!locked){ dropCounter+=delta; if(dropCounter>dropInterval) drop(); }
  draw();
  requestAnimationFrame(loop);
}
function drawPauseOverlay(){
  const pxW=cell*cols, pxH=cell*rows;
  ctx.fillStyle='rgba(8,17,29,0.72)'; ctx.fillRect(0,0,pxW,pxH);
  ctx.fillStyle='#f3bc37';
  ctx.font='bold '+(cell*1.6)+'px "Russo One", sans-serif';
  ctx.textAlign='center';
  ctx.shadowColor='#f3bc37'; ctx.shadowBlur=12;
  ctx.fillText('ПАУЗА', pxW/2, pxH/2);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,245,207,0.7)';
  ctx.font=(cell*0.42)+'px "Rubik", sans-serif';
  ctx.fillText('Нажми на паузу ещё раз', pxW/2, pxH/2+cell*0.9);
}
document.getElementById('pauseBtn').onclick=()=>{
  if(!alive) return;
  paused=!paused;
  if(!paused){ lastTime=0; requestAnimationFrame(loop); }
};
function reset(){
  resizeCanvas();
  grid=emptyGrid(); score=0; lines=0; level=1; alive=true; paused=false; locked=false;
  dropCounter=0; dropInterval=START_SPEED; lastTime=0; flashTimer=0; flashRows=[]; landFlash=[]; landFlashTimer=0;
  nextPiece=null;
  document.getElementById('score').textContent='Очки: 0';
  document.getElementById('lines').textContent='Линии: 0';
  document.getElementById('level').textContent='Уровень: 1';
  document.getElementById('overlay').classList.remove('show');
  current=newPiece();
  requestAnimationFrame(loop);
}
document.getElementById('left').onclick=()=>move(-1);
document.getElementById('right').onclick=()=>move(1);
document.getElementById('down').onclick=drop;
document.getElementById('rotate').onclick=doRotate;
document.getElementById('restart').onclick=reset;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') move(-1);
  if(e.key==='ArrowRight') move(1);
  if(e.key==='ArrowDown') drop();
  if(e.key==='ArrowUp') doRotate();
});
let touchStartX=0, touchStartY=0, touchMoved=false;
canvas.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; touchMoved=false; },{passive:true});
canvas.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-touchStartX;
  if(Math.abs(dx)>28){ move(dx>0?1:-1); touchStartX=e.touches[0].clientX; touchMoved=true; }
},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(!touchMoved){ if(dy>40) drop(); else doRotate(); }
},{passive:true});
if(document.readyState==='complete' || document.readyState==='interactive') reset();
else window.addEventListener('DOMContentLoaded', reset);
</script>
</body>
</html>
