<style>
:root{
  --space:#111d2d;--space-deep:#08111d;--ink:#14202b;
  --cream:#fff5cf;--paper:#f6e8bd;--gold:#f3bc37;
  --cyan:#55d8df;--green:#62bc76;--green-dark:#306754;
  --red:#d8422c;--purple:#a87be0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;margin:0;padding:0;}
html,body{
  height:100%;width:100%;font-family:'Rubik',sans-serif;color:var(--cream);
  touch-action:none;overscroll-behavior:none;overflow:hidden;
  background-color:var(--space-deep);
  background-image:
    radial-gradient(circle at 8%  12%,#f6e8bd 0 1px,transparent 1.8px),
    radial-gradient(circle at 82%  8%,#f3bc37 0 1.5px,transparent 2.2px),
    radial-gradient(circle at 13% 45%,#69dae0 0 1px,transparent 1.8px),
    radial-gradient(circle at 91% 52%,#f6e8bd 0 1px,transparent 1.8px),
    radial-gradient(circle at 25% 81%,#f3bc37 0 1.5px,transparent 2.2px),
    linear-gradient(165deg,#1b3546 0%,var(--space) 52%,var(--space-deep) 100%);
  background-size:145px 155px,177px 173px,211px 218px,189px 199px,253px 239px,auto;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.52'/%3E%3C/svg%3E");
}

/* ── layout ── */
.page{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;padding:64px 14px 12px;gap:0;}

/* ── top buttons ── */
.icon-btn{
  position:fixed;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#2C5F8A,#1B3F5C);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:#fff;z-index:20;
  border:2px solid #5B8EB5;
  box-shadow:0 4px 0 #163049,0 7px 14px -5px rgba(0,0,0,.45),0 0 12px rgba(91,142,181,.4);
  cursor:pointer;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #163049;}
.icon-btn svg{width:19px;height:19px;}
.btn-back  {top:11px;left:11px;}
.btn-skins {top:11px;right:60px;}
.btn-rec   {top:11px;right:11px;}

/* ── title ── */
.title{
  font-family:'Russo One',sans-serif;font-size:clamp(17px,5.5vw,23px);
  color:var(--gold);text-shadow:0 0 14px rgba(243,188,55,.35),1px 1px 0 var(--ink);
  margin-bottom:8px;
}

/* ── HUD pills ── */
.hud{display:flex;gap:8px;margin-bottom:10px;}
.pill{
  background:rgba(20,32,43,.72);border-radius:13px;padding:5px 14px;
  text-align:center;border:1.5px solid rgba(255,245,207,.12);min-width:78px;
}
.pill .lbl{font-size:9px;font-weight:700;color:rgba(255,245,207,.5);text-transform:uppercase;letter-spacing:.5px;}
.pill .val{font-family:'Russo One',sans-serif;font-size:17px;color:var(--cream);}

/* ── board ── */
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;overflow:hidden;padding-top:12px;}
#board{
  position:relative;border-radius:14px;
  border:3px solid var(--ink);
  box-shadow:0 8px 0 var(--ink),0 14px 28px rgba(0,0,0,.55);
  touch-action:none;
  /* background set by JS */
}
/* background cells */
.bg-cell{
  position:absolute;border-radius:8px;
  background:rgba(0,0,0,.28);
}
/* tiles */
.tile{
  position:absolute;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Russo One',sans-serif;line-height:1;
  box-shadow:0 3px 7px rgba(0,0,0,.35);
  /* position transitions */
  transition:top .1s ease, left .1s ease;
  will-change:top,left,transform;
}
.tile.t-new{animation:tileIn .15s ease both;}
.tile.t-drop{}
.tile.t-merge{animation:tilePop .18s ease both;}
@keyframes tileIn {from{transform:scale(.25);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes tilePop{0%{transform:scale(1);}45%{transform:scale(1.2);}100%{transform:scale(1);}}

.hint{color:rgba(255,245,207,.42);font-size:11px;font-weight:600;margin-top:8px;text-align:center;}

/* ── overlays ── */
.overlay{position:fixed;inset:0;background:rgba(8,11,20,.8);display:none;align-items:center;justify-content:center;z-index:30;padding:20px;}
.overlay.show{display:flex;}
.modal{
  background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px 20px 13px 18px;
  padding:24px 20px;text-align:center;max-width:300px;width:100%;
  box-shadow:0 6px 0 var(--ink),0 14px 30px rgba(0,0,0,.5);
  position:relative;
}
.modal h2{font-family:'Russo One',sans-serif;font-size:20px;color:var(--red);-webkit-text-stroke:1px var(--ink);margin-bottom:8px;}
.modal h2.c-win{color:var(--green);}
.modal h2.c-gold{color:#a06000;}
.modal p{font-weight:600;color:#49515a;margin:0 0 10px;font-size:13px;}
.mbtn{
  font-family:'Russo One',sans-serif;font-size:14px;padding:10px 24px;
  border-radius:10px 18px 11px 16px;border:3px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);cursor:pointer;display:inline-block;margin-top:6px;
}
.mbtn.gold{background:var(--gold);color:var(--ink);}
.mbtn.gold:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.mbtn.ghost{background:rgba(20,32,43,.08);color:var(--ink);box-shadow:none;border-color:rgba(20,32,43,.2);}

/* skins */
.skins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.sk{
  aspect-ratio:1;border-radius:11px;border:2.5px solid transparent;
  background:rgba(20,32,43,.06);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;
}
.sk .sn{font-size:9px;font-weight:700;color:#49515a;}
.sk.locked{opacity:.38;cursor:default;}
.sk.on{border-color:var(--green);}
.sk .ul{position:absolute;bottom:3px;right:4px;font-size:8px;font-weight:700;color:#888;}

/* records */
.rec{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid rgba(20,32,43,.1);font-weight:700;font-size:13px;color:var(--ink);}
.rec .rd{color:#888;font-size:11px;}
</style>
</head>

<script>
// ── Telegram ──
if(window.Telegram?.WebApp){
  const tg=window.Telegram.WebApp;
  tg.ready();tg.expand();
  if(typeof tg.disableVerticalSwipes==='function')tg.disableVerticalSwipes();
}
const haptic=t=>{try{window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred(t);}catch(e){}};
const himpact=t=>{try{window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(t);}catch(e){}};

// ── Firebase ──
const FB={apiKey:"AIzaSyCrJMG_08oGzYacC317lMYkWTyIiS0IHFA",authDomain:"sims-menu-games-2.firebaseapp.com",databaseURL:"https://sims-menu-games-2-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sims-menu-games-2",storageBucket:"sims-menu-games-2.firebasestorage.app",messagingSenderId:"207186943278",appId:"1:207186943278:web:2214b83e6218b86baaaebf"};
let db=null;
try{firebase.initializeApp(FB);db=firebase.database();}catch(e){}
function getMe(){try{const u=window.Telegram?.WebApp?.initDataUnsafe?.user;if(u)return{id:String(u.id),name:u.first_name+(u.last_name?' '+u.last_name:'')};}catch(e){}let id=localStorage.getItem('lb_guest');if(!id){id='g_'+Math.random().toString(36).slice(2,9);localStorage.setItem('lb_guest',id);}return{id,name:'Гость'};}
const ME=getMe();
function lbSubmit(sc){if(!db||!sc)return;const ref=db.ref('leaderboard/2048/'+ME.id);ref.once('value').then(snap=>{const c=snap.val();if(!c||sc>(c.score||0))ref.set({userId:ME.id,name:ME.name,score:sc,updatedAt:Date.now()});}).catch(()=>{});}

// ── Cloud storage ──
function csOK(){try{return!!(window.Telegram?.WebApp?.CloudStorage&&typeof window.Telegram.WebApp.CloudStorage.getItem==='function');}catch(e){return false;}}
function csGet(k,def,cb){if(csOK()){window.Telegram.WebApp.CloudStorage.getItem(k,(e,v)=>cb(!e&&v!=null&&v!==''?v:def));}else cb(localStorage.getItem(k)??def);}
function csSet(k,v){localStorage.setItem(k,String(v));if(csOK())window.Telegram.WebApp.CloudStorage.setItem(k,String(v),()=>{});}

// ── Themes ──
const THEMES=[
  {id:'space',  name:'Космос',  unlock:0,
   board:'#0e1e30',
   c:{2:'#1e3d5c',4:'#1e5070',8:'#c84c2a',16:'#d85f1a',32:'#e06810',64:'#e87800',128:'#4a8acc',256:'#3670b8',512:'#2458a0',1024:'#8844c0',2048:'#f3bc37',4096:'#f3bc37',8192:'#f3bc37'},
   tc:{2:'#7ab8d8',4:'#7ad0e8',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#fff',256:'#fff',512:'#fff',1024:'#fff',2048:'#fff'}},
  {id:'classic',name:'Классик',unlock:128,
   board:'#B8A99A',
   c:{2:'#EEE4DA',4:'#EDE0C8',8:'#F2B179',16:'#F59563',32:'#F67C5F',64:'#F65E3B',128:'#EDCF72',256:'#EDCC61',512:'#EDC850',1024:'#EDC53F',2048:'#EDC22E',4096:'#EDC22E',8192:'#EDC22E'},
   tc:{2:'#776E65',4:'#776E65',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#fff',256:'#fff',512:'#fff',1024:'#fff',2048:'#fff'}},
  {id:'ocean',  name:'Океан',  unlock:512,
   board:'#0d1e2e',
   c:{2:'#DCEFFB',4:'#B9E1F7',8:'#7FC8ED',16:'#4FB8E8',32:'#2E9BD6',64:'#1B7FA8',128:'#155E80',256:'#0F4A66',512:'#0A3550',1024:'#062338',2048:'#03141F',4096:'#03141F',8192:'#03141F'},
   tc:{2:'#2a6080',4:'#1a4060',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#fff',256:'#fff',512:'#fff',1024:'#fff',2048:'#fff'}},
  {id:'sunset', name:'Закат',  unlock:1024,
   board:'#1e0c18',
   c:{2:'#FFE0C2',4:'#FFC79A',8:'#FFA36B',16:'#FF7F50',32:'#F5637A',64:'#E14D8C',128:'#C23B8F',256:'#9A2E8A',512:'#732280',1024:'#4E1866',2048:'#2E0F4D',4096:'#2E0F4D',8192:'#2E0F4D'},
   tc:{2:'#803020',4:'#602010',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#fff',256:'#fff',512:'#fff',1024:'#fff',2048:'#fff'}},
  {id:'plasma', name:'Плазма', unlock:2048,
   board:'#0a0516',
   c:{2:'#E8D9FF',4:'#D3B8FF',8:'#B98CFF',16:'#A363F5',32:'#8C3FE0',64:'#7228C4',128:'#5C1BA3',256:'#471382',512:'#340C63',1024:'#210645',2048:'#12022B',4096:'#12022B',8192:'#12022B'},
   tc:{2:'#6040a0',4:'#5030a0',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#fff',256:'#fff',512:'#fff',1024:'#fff',2048:'#fff'}},
];

// ── State ──
let SIZE=4, theme=THEMES[0], best=0, maxTile=0, records=[];
let grid=[], score=0, alive=false, wonShown=false, tileId=0;
// grid[r][c] = {id, val} or null

// ── Board geometry ──
const boardEl=document.getElementById('board');
let bp=320, gap=8, cell=72; // pixels, recalculated

function recalcGeom(){
  const wrap=document.querySelector('.board-wrap');
  // Use full width; height is limited by viewport minus UI
  const uiH=160; // approx header+HUD+hint
  const avail=Math.min(wrap.clientWidth, wrap.clientHeight, window.innerHeight-uiH);
  bp=Math.floor(Math.min(wrap.clientWidth*0.99, avail*0.99));
  gap=Math.max(4, Math.min(10, Math.floor(bp*0.025)));
  cell=(bp - gap*(SIZE+1))/SIZE;
  boardEl.style.width=bp+'px';
  boardEl.style.height=bp+'px';
  boardEl.style.background=theme.board;
  boardEl.style.overflow='visible';
}

function px(r,c){
  return{
    top:  gap + r*(cell+gap),
    left: gap + c*(cell+gap)
  };
}

// ── Render background cells ──
function renderBg(){
  boardEl.querySelectorAll('.bg-cell').forEach(e=>e.remove());
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const d=document.createElement('div');
    d.className='bg-cell';
    const p=px(r,c);
    d.style.cssText=`width:${cell}px;height:${cell}px;top:${p.top}px;left:${p.left}px;`;
    boardEl.appendChild(d);
  }
}

// ── Tile DOM management ──
// We keep a Map<id, HTMLElement> for smooth position transitions
const tileDoms=new Map();

function tileColor(v){return theme.c[v]||theme.c[2048]||'#333';}
function tileTextColor(v){return (theme.tc&&theme.tc[v])||'#fff';}
function tileFontSize(v){
  const digits=String(v).length;
  const base=cell*0.42;
  if(digits>=5) return base*0.52;
  if(digits===4) return base*0.65;
  if(digits===3) return base*0.8;
  return base;
}
function tileGlow(v){
  if(v>=2048) return `0 0 18px ${tileColor(v)},0 0 6px ${tileColor(v)},0 3px 8px rgba(0,0,0,.4)`;
  if(v>=128)  return `0 0 ${Math.min(v/80,10)}px ${tileColor(v)},0 3px 7px rgba(0,0,0,.35)`;
  return '0 3px 7px rgba(0,0,0,.3)';
}

function createTileDom(tile, anim){
  const d=document.createElement('div');
  const p=px(tile.r, tile.c);
  const styleBase=`width:${cell}px;height:${cell}px;left:${p.left}px;background:${tileColor(tile.val)};color:${tileTextColor(tile.val)};font-size:${tileFontSize(tile.val)}px;box-shadow:${tileGlow(tile.val)};`;
  if(anim==='new'){
    // Start above the board, drop down to final position
    d.className='tile t-drop';
    d.style.cssText=styleBase+`top:${-cell-gap}px;transition:none;`;
    boardEl.appendChild(d);
    d.textContent=tile.val;
    // Force reflow then animate drop
    d.getBoundingClientRect();
    requestAnimationFrame(()=>{
      d.style.transition='top 0.22s cubic-bezier(0.4,0,0.2,1)';
      d.style.top=p.top+'px';
    });
  } else if(anim==='merge'){
    d.className='tile t-merge';
    d.style.cssText=styleBase+`top:${p.top}px;`;
    boardEl.appendChild(d);
    d.textContent=tile.val;
  } else {
    d.className='tile';
    d.style.cssText=styleBase+`top:${p.top}px;`;
    boardEl.appendChild(d);
    d.textContent=tile.val;
  }
  return d;
}

function syncTileDoms(movedTiles, newTiles, mergedTiles){
  // 1. Move existing tiles to new positions (CSS transition does the animation)
  movedTiles.forEach(({id,r,c})=>{
    const d=tileDoms.get(id);
    if(!d)return;
    const p=px(r,c);
    d.style.top=p.top+'px';
    d.style.left=p.left+'px';
  });
  // 2. Remove merged source tiles after transition
  mergedTiles.forEach(({removedId})=>{
    // remove after slide animation finishes
    const d=tileDoms.get(removedId);
    if(d) setTimeout(()=>{d.remove();tileDoms.delete(removedId);},120);
  });
  // 3. Add new tiles (spawned or merged result) after slide
  setTimeout(()=>{
    newTiles.forEach(tile=>{
      // remove old dom if overwriting (merged result replaces source)
      const old=tileDoms.get(tile.id);
      if(old){old.remove();}
      const d=createTileDom(tile, tile._anim||'new');
      tileDoms.set(tile.id, d);
    });
  }, 100);
}

// ── Full re-render (after resize / new game) ──
function fullRender(){
  boardEl.querySelectorAll('.tile').forEach(e=>e.remove());
  tileDoms.clear();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const t=grid[r][c];
    if(!t)continue;
    const d=createTileDom({...t,r,c},'');
    tileDoms.set(t.id,d);
  }
}

// ── Game init ──
function newGrid(){return Array.from({length:SIZE},()=>Array(SIZE).fill(null));}

function emptyPositions(){
  const out=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!grid[r][c]) out.push([r,c]);
  return out;
}

function spawnTile(anim='new'){
  const empty=emptyPositions();
  if(!empty.length)return null;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  // Spawn value: 90% → 2, 8% → 4, 2% → 8 (adds variety per description)
  const rnd=Math.random();
  const val=rnd<0.88?2:rnd<0.97?4:8;
  const tile={id:++tileId, val, r, c, _anim:anim};
  grid[r][c]=tile;
  return tile;
}

function startGame(){
  grid=newGrid(); score=0; alive=true; wonShown=false; tileId=0;
  tileDoms.clear();
  document.getElementById('vScore').textContent='0';
  document.getElementById('vBest').textContent=best.toLocaleString('ru');
  document.getElementById('vSize').textContent=SIZE+'×'+SIZE;
  recalcGeom(); renderBg();
  // Spawn 2 initial tiles
  const t1=spawnTile('new');
  const t2=spawnTile('new');
  boardEl.querySelectorAll('.tile').forEach(e=>e.remove());
  tileDoms.clear();
  if(t1){const d=createTileDom(t1,'new');tileDoms.set(t1.id,d);}
  if(t2){const d=createTileDom(t2,'new');tileDoms.set(t2.id,d);}
  document.getElementById('ovGameover').classList.remove('show');
  document.getElementById('ovWin').classList.remove('show');
}

// ── Core move logic ──
// Returns {newRow, gained, moves:[{id,toIdx}], merged:[{id,removedId,val}]}
function slideLeft(row){
  // row: array of {id,val} or null, length=SIZE
  const tiles=row.filter(Boolean); // non-null, in order
  const result=[];
  const merges=[]; // {id(winner), removedId, val}
  let i=0;
  while(i<tiles.length){
    if(i+1<tiles.length && tiles[i].val===tiles[i+1].val){
      const newVal=tiles[i].val*2;
      const winner={...tiles[i], val:newVal, _anim:'merge'};
      result.push(winner);
      merges.push({id:winner.id, removedId:tiles[i+1].id, val:newVal});
      i+=2;
    } else {
      result.push({...tiles[i]});
      i++;
    }
  }
  while(result.length<SIZE) result.push(null);
  const gained=merges.reduce((s,m)=>s+m.val,0);
  return{newRow:result, gained, merges};
}

function move(dir){
  if(!alive)return;

  // We'll transform the grid so we always slide left, then transform back
  // Directions: left=0, up=1(rot CCW), right=2(rot 180), down=3(rot CW)
  let rotations=0;
  if(dir==='up')   rotations=1; // rotate CW → slide left
  if(dir==='right') rotations=2;
  if(dir==='down')  rotations=3;

  // Rotate grid CW `rotations` times
  function rotateCW(g){
    const n=g.length;
    return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>g[n-1-c][r]));
  }
  let rotated=grid.map(r=>[...r]);
  for(let i=0;i<rotations;i++) rotated=rotateCW(rotated);

  let totalGain=0, anyMoved=false;
  const allMoves=[], allMerges=[], newSpawnIds=[];

  for(let r=0;r<SIZE;r++){
    const row=rotated[r];
    const before=row.map(t=>t?.id||0).join(',');
    const {newRow,gained,merges}=slideLeft(row);
    const after=newRow.map(t=>t?.id||0).join(',');
    if(before!==after) anyMoved=true;
    totalGain+=gained;
    // Track position changes
    newRow.forEach((t,c)=>{
      if(t){
        allMoves.push({id:t.id, toRow:r, toCol:c, anim:t._anim});
        if(t._anim==='merge') newSpawnIds.push({id:t.id, val:t.val, toRow:r, toCol:c});
      }
    });
    merges.forEach(m=>allMerges.push(m));
    rotated[r]=newRow;
  }

  if(!anyMoved) return;

  // Rotate back CCW `rotations` times (CCW = CW × 3)
  function rotateCCW(g){
    const n=g.length;
    return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>g[c][n-1-r]));
  }
  let finalGrid=rotated;
  for(let i=0;i<rotations;i++) finalGrid=rotateCCW(finalGrid);

  // Figure out real row/col after back-rotation for each tile
  // Recompute positions from finalGrid
  const posById=new Map();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const t=finalGrid[r][c];
    if(t) posById.set(t.id,{r,c,val:t.val,anim:t._anim||''});
  }

  // 1. Slide existing tiles (CSS transition)
  posById.forEach(({r,c,anim},id)=>{
    const d=tileDoms.get(id);
    if(!d) return;
    const p=px(r,c);
    d.style.top=p.top+'px';
    d.style.left=p.left+'px';
    // Update value/color for merged tile after transition
    if(anim==='merge'){
      setTimeout(()=>{
        if(!d.parentNode) return;
        const {r:nr,c:nc,val}=posById.get(id)||{};
        d.textContent=val;
        d.style.background=tileColor(val);
        d.style.color=tileTextColor(val);
        d.style.fontSize=tileFontSize(val)+'px';
        d.style.boxShadow=tileGlow(val);
        d.className='tile t-merge';
        // Remove class after animation
        setTimeout(()=>d.classList.remove('t-merge'),200);
      },100);
    }
  });

  // 2. Remove merged losers after slide
  allMerges.forEach(({removedId})=>{
    setTimeout(()=>{
      const d=tileDoms.get(removedId);
      if(d){d.remove();tileDoms.delete(removedId);}
    },105);
  });

  // 3. Apply new grid
  grid=finalGrid;
  score+=totalGain;

  // 4. Spawn new tile after slide
  setTimeout(()=>{
    const spawned=spawnTile('new');
    if(spawned){
      const p=px(spawned.r,spawned.c);
      const d=createTileDom(spawned,'new');
      tileDoms.set(spawned.id,d);
    }
    // Update score display
    document.getElementById('vScore').textContent=score.toLocaleString('ru');
    if(score>best){
      best=score;csSet('g2048_best',best);
      document.getElementById('vBest').textContent=best.toLocaleString('ru');
      lbSubmit(best);
    }
    // Check max tile
    let mx=0;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]) mx=Math.max(mx,grid[r][c].val);
    if(mx>maxTile){maxTile=mx;csSet('g2048_maxtile',maxTile);}
    if(mx>=2048&&!wonShown){wonShown=true;document.getElementById('ovWin').classList.add('show');haptic('success');}
    if(!canMove()){
      alive=false;
      saveRecord(score);lbSubmit(score);
      setTimeout(()=>{
        document.getElementById('goText').textContent='Очки: '+score.toLocaleString('ru');
        document.getElementById('ovGameover').classList.add('show');
      },250);
      haptic('error');
    } else if(totalGain>0){
      himpact('light');
    }
  },115);
}

function canMove(){
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    if(!grid[r][c]) return true;
    const v=grid[r][c].val;
    if(c<SIZE-1 && grid[r][c+1] && grid[r][c+1].val===v) return true;
    if(r<SIZE-1 && grid[r+1][c] && grid[r+1][c].val===v) return true;
  }
  return false;
}

// ── Records ──
function saveRecord(sc){
  if(!sc||sc<=0)return;
  records.push({score:sc,date:new Date().toLocaleDateString('ru-RU')});
  records.sort((a,b)=>b.score-a.score);records=records.slice(0,10);
  const j=JSON.stringify(records);
  localStorage.setItem('g2048_records',j);
  if(csOK())window.Telegram.WebApp.CloudStorage.setItem('g2048_records',j,()=>{});
}

function renderRecords(){
  const el=document.getElementById('recList');
  if(!records.length){el.innerHTML='<p style="text-align:center;color:#888;font-weight:700;padding:12px;">Пока пусто — сыграй!</p>';return;}
  el.innerHTML=records.map((r,i)=>`<div class="rec"><span>${i+1}. <b>${r.score.toLocaleString('ru')}</b> очков</span><span class="rd">${r.date}</span></div>`).join('');
}

// ── Skins UI ──
function renderSkins(){
  const g=document.getElementById('skinsGrid');g.innerHTML='';
  THEMES.forEach(t=>{
    const unlocked=maxTile>=t.unlock;
    const d=document.createElement('div');
    d.className='sk'+(unlocked?'':' locked')+(t.id===theme.id?' on':'');
    const sw=document.createElement('div');
    sw.style.cssText=`width:28px;height:28px;border-radius:7px;background:${unlocked?t.c[128]:'#888'};box-shadow:${unlocked?'0 0 8px '+t.c[128]:'none'}`;
    const sn=document.createElement('span');sn.className='sn';sn.textContent=unlocked?t.name:'???';
    d.appendChild(sw);d.appendChild(sn);
    if(!unlocked){const ll=document.createElement('span');ll.className='ul';ll.textContent=t.unlock+'✦';d.appendChild(ll);}
    if(unlocked) d.onclick=()=>{theme=t;csSet('g2048_theme',t.id);boardEl.style.background=t.board;fullRender();renderSkins();};
    g.appendChild(d);
  });
  // Size buttons
  document.querySelectorAll('.sz-btn').forEach(b=>{
    const sz=parseInt(b.dataset.size);
    b.style.fontWeight=sz===SIZE?'900':'600';
    b.style.borderColor=sz===SIZE?'var(--green)':'rgba(20,32,43,.2)';
    b.onclick=()=>{SIZE=sz;csSet('g2048_size',sz);startGame();document.getElementById('ovSkins').classList.remove('show');};
  });
}

// ── Input ──
document.addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});
let sx=0,sy=0,dragging=false;
boardEl.addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;e.preventDefault();boardEl.setPointerCapture(e.pointerId);});
boardEl.addEventListener('pointermove',e=>{if(dragging)e.preventDefault();});
boardEl.addEventListener('pointerup',e=>{
  if(!dragging)return;dragging=false;e.preventDefault();
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});
boardEl.addEventListener('pointercancel',()=>dragging=false);
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',()=>{recalcGeom();renderBg();fullRender();});

// ── Button wiring ──
document.getElementById('btnRestart').onclick=startGame;
document.getElementById('btnContinue').onclick=()=>document.getElementById('ovWin').classList.remove('show');
document.getElementById('btnSkins').onclick=()=>{renderSkins();document.getElementById('ovSkins').classList.add('show');};
document.getElementById('btnCloseSkins').onclick=()=>document.getElementById('ovSkins').classList.remove('show');
document.getElementById('btnRec').onclick=()=>{renderRecords();document.getElementById('ovRec').classList.add('show');};
document.getElementById('btnCloseRec').onclick=()=>document.getElementById('ovRec').classList.remove('show');

// ── Boot ──
let booted=false;
function boot(){
  if(booted)return;booted=true;
  csGet('g2048_best','0',b=>{best=parseInt(b)||0;
  csGet('g2048_maxtile','0',m=>{maxTile=parseInt(m)||0;
  csGet('g2048_theme','space',th=>{
    theme=THEMES.find(t=>t.id===th&&maxTile>=t.unlock)||THEMES[0];
  csGet('g2048_size','4',sz=>{SIZE=parseInt(sz)||4;
    const loadRec=cb=>{
      if(csOK()){window.Telegram.WebApp.CloudStorage.getItem('g2048_records',(e,v)=>{
        try{records=(!e&&v)?JSON.parse(v):JSON.parse(localStorage.getItem('g2048_records')||'[]');}catch(ex){records=[];}cb();
      });}else{try{records=JSON.parse(localStorage.getItem('g2048_records')||'[]');}catch(ex){records=[];}cb();}
    };
    loadRec(startGame);
  });});});});
}
window.addEventListener('load',boot);
if(document.readyState==='complete')boot();
</script>
