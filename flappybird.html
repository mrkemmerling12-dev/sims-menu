<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --space:      #111d2d;
  --space-deep: #08111d;
  --ink:        #14202b;
  --cream:      #fff5cf;
  --paper:      #f6e8bd;
  --red:        #d8422c;
  --gold:       #f3bc37;
  --cyan:       #55d8df;
  --green:      #62bc76;
  --green-dark: #306754;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{
  margin:0;padding:0;height:100%;width:100%;
  font-family:'Rubik',sans-serif;color:var(--cream);
  touch-action:none;overscroll-behavior:none;overflow:hidden;
  background-color:var(--space-deep);
}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
.board-holder{flex:1;position:relative;min-height:0;}
canvas{display:block;width:100%;height:100%;}
.icon-btn{
  position:fixed;width:42px;height:42px;border-radius:50%;
  background:rgba(20,32,43,0.88);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;z-index:20;
  border:3px solid var(--ink);
  box-shadow:0 4px 0 var(--ink),0 6px 14px rgba(0,0,0,0.45);
  transition:transform 0.12s;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.icon-btn svg{width:20px;height:20px;}
.back-btn{top:12px;left:12px;}
.skin-btn{top:66px;right:12px;}
.pause-btn{top:12px;right:12px;}
.records-btn{top:66px;left:12px;}
.overlay{position:fixed;inset:0;background:rgba(8,17,29,0.78);display:none;align-items:center;justify-content:center;z-index:30;padding:20px;}
.overlay.show{display:flex;}
.modal{
  background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px 20px 13px 18px;
  padding:26px 24px;text-align:center;max-width:310px;width:88%;
  box-shadow:0 6px 0 var(--ink),0 14px 30px rgba(0,0,0,0.5);
}
.modal h2{
  font-family:'Russo One',sans-serif;margin:0 0 8px;font-size:22px;
  color:var(--red);-webkit-text-stroke:1px var(--ink);
  text-shadow:2px 2px 0 rgba(20,32,43,0.25);
}
.modal p{font-weight:600;color:#49515a;margin:0 0 10px;}
.modal .best{font-size:13px;color:#49515a;margin-bottom:16px;}
.btn-main{
  background:var(--gold);border:3px solid var(--ink);color:var(--ink);
  font-family:'Russo One',sans-serif;font-size:15px;
  padding:11px 26px;border-radius:10px 18px 11px 16px;
  box-shadow:0 5px 0 var(--ink);cursor:pointer;
}
.btn-main:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.skins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.skin-opt{
  aspect-ratio:1/1;border-radius:12px;
  background:rgba(20,32,43,0.6);
  border:2px solid rgba(255,245,207,0.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:24px;position:relative;gap:2px;cursor:pointer;
}
.skin-opt .name{font-size:9px;font-weight:700;color:#8a9aaa;}
.skin-opt.locked{opacity:0.35;}
.skin-opt.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.skin-opt .lock{position:absolute;bottom:2px;right:4px;font-size:9px;color:#8a9aaa;font-weight:700;}
#recordsList div{border-bottom:1px solid rgba(20,32,43,0.15);}
@media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}
</style>
</head>
<body>
<a class="icon-btn back-btn" href="index.html" aria-label="Назад">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M60 20 L32 50 L60 80" fill="none" stroke="var(--cream)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>
<button class="icon-btn skin-btn" id="skinBtn" aria-label="Скины">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,8 61,38 93,38 67,57 77,88 50,69 23,88 33,57 7,38 39,38" fill="none" stroke="var(--cream)" stroke-width="6" stroke-linejoin="round"/>
  </svg>
</button>
<button class="icon-btn pause-btn" id="pauseBtn" aria-label="Пауза">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="24" width="14" height="52" rx="4" fill="var(--cream)"/>
    <rect x="58" y="24" width="14" height="52" rx="4" fill="var(--cream)"/>
  </svg>
</button>
<button class="icon-btn records-btn" id="recordsBtn" aria-label="Рекорды">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 15 L58 38 L83 38 L62 52 L70 76 L50 62 L30 76 L38 52 L17 38 L42 38 Z" fill="var(--cream)"/>
  </svg>
</button>
<div class="wrap">
  <div class="board-holder"><canvas id="board"></canvas></div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="overTitle">Игра окончена 🪶</h2>
    <p id="finalScore">Счёт: 0</p>
    <p class="best" id="bestScore">Рекорд: 0</p>
    <button class="btn-main" id="restart">Сыграть ещё</button>
  </div>
</div>
<div class="overlay" id="skinOverlay">
  <div class="modal">
    <h2>Скины</h2>
    <p class="best">Открываются каждые 50 очков рекорда</p>
    <div class="skins-grid" id="skinsGrid"></div>
    <button class="btn-main" id="closeSkins">Закрыть</button>
  </div>
</div>
<div class="overlay" id="recordsOverlay">
  <div class="modal">
    <h2>🏆 Мои рекорды</h2>
    <p class="best">Топ-10 твоих лучших попыток</p>
    <div id="recordsList" style="text-align:left;margin:10px 0;max-height:240px;overflow-y:auto;"></div>
    <button class="btn-main" id="closeRecords">Закрыть</button>
  </div>
</div>
<script>
if(window.Telegram && window.Telegram.WebApp){
  const tg=window.Telegram.WebApp;
  tg.ready(); tg.expand();
  if(typeof tg.disableVerticalSwipes==='function') tg.disableVerticalSwipes();
}
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
let W=0,H=0;
function resizeCanvas(){
  const holder=document.querySelector('.board-holder');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const prevW=W,prevH=H;
  W=holder.clientWidth;H=holder.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(prevW&&prevH&&(prevW!==W||prevH!==H)){
    const sx=W/prevW,sy=H/prevH;
    if(typeof bird==='object'&&bird){bird.x*=sx;bird.y*=sy;bird.r*=sy;bird.v*=sy;}
    if(Array.isArray(pipes)) pipes.forEach(p=>{p.x*=sx;p.top*=sy;p.gap*=sy;});
    if(Array.isArray(clouds)) clouds.forEach(c=>{c.x*=sx;c.y*=sy;});
    if(Array.isArray(stars)) stars.forEach(s=>{s.x*=sx;s.y*=sy;});
    if(typeof speed==='number') speed*=sx;
    pipeInterval=Math.max(1,Math.round(W*0.42));
  }
}
window.addEventListener('resize',resizeCanvas);
const SKINS=[
  {id:'classic',emoji:'🐤',name:'Классика',unlock:0,body:'#FFC94D',bodyLight:'#FFE29A',beak:'#FF8A3D',sky:['#8FE0D8','#DFF7EA']},
  {id:'crow',emoji:'🐦‍⬛',name:'Ворон',unlock:50,body:'#2b2b36',bodyLight:'#454554',beak:'#8a8a9a',sky:['#4a4a5a','#2a2a35'],extra:'crow'},
  {id:'silver',emoji:'🕊️',name:'Серебро',unlock:100,body:'#C7CDD6',bodyLight:'#EDEFF3',beak:'#8B93A1',sky:['#AEB9C7','#E7ECF2']},
  {id:'sigma',emoji:'😎',name:'Сигма',unlock:150,body:'#3d3d46',bodyLight:'#5c5c68',beak:'#FFD24D',sky:['#232331','#3a3a4a'],extra:'sigma'},
  {id:'gold',emoji:'🐥',name:'Золото',unlock:200,body:'#FFD700',bodyLight:'#FFF3B0',beak:'#E8960C',sky:['#FFDD7A','#FFF3D0']},
  {id:'crylaugh',emoji:'😂',name:'Плакса',unlock:250,body:'#FFE24D',bodyLight:'#FFF3A0',beak:'#FF8A3D',sky:['#FFD36E','#FFF0C2'],extra:'crylaugh'},
  {id:'platinum',emoji:'🦢',name:'Платина',unlock:300,body:'#E5E8F5',bodyLight:'#FFFFFF',beak:'#B7A8E0',sky:['#D6D9F5','#F3F0FF']},
  {id:'gigachad',emoji:'🗿',name:'Гигачад',unlock:350,body:'#D9D2C4',bodyLight:'#F0ECE0',beak:'#8B7D5A',sky:['#B8AC94','#E8E0CC'],extra:'gigachad'},
];
let BEST=0,SELECTED_SKIN='classic',RECORDS=[],dataLoaded=false;
const CLOUD_TIMEOUT=2500;
function cloudAvailable(){return !!(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.CloudStorage&&typeof window.Telegram.WebApp.CloudStorage.getItem==='function');}
function cloudGet(key){
  return new Promise(resolve=>{
    if(!cloudAvailable()){resolve(null);return;}
    let settled=false;
    const timer=setTimeout(()=>{if(!settled){settled=true;resolve(null);}},CLOUD_TIMEOUT);
    try{window.Telegram.WebApp.CloudStorage.getItem(key,(err,val)=>{if(settled)return;settled=true;clearTimeout(timer);resolve(err?null:val);});}
    catch(e){if(!settled){settled=true;clearTimeout(timer);resolve(null);}}
  });
}
function cloudSet(key,val){if(!cloudAvailable())return;try{window.Telegram.WebApp.CloudStorage.setItem(key,String(val),()=>{});}catch(e){}}
function localInt(key){const n=parseInt(localStorage.getItem(key)||'0',10);return Number.isFinite(n)?n:0;}
async function loadUserData(){
  const[bestVal,skinVal,recVal]=await Promise.all([cloudGet('flappy_best'),cloudGet('flappy_skin'),cloudGet('flappy_records')]);
  const cloudBest=parseInt(bestVal,10);
  BEST=Math.max(Number.isFinite(cloudBest)?cloudBest:0,localInt('flappy_best'));
  SELECTED_SKIN=skinVal||localStorage.getItem('flappy_skin')||'classic';
  try{RECORDS=JSON.parse(recVal||localStorage.getItem('flappy_records')||'[]');}catch(e){RECORDS=[];}
  if(!Array.isArray(RECORDS))RECORDS=[];
  localStorage.setItem('flappy_best',String(BEST));localStorage.setItem('flappy_skin',SELECTED_SKIN);dataLoaded=true;
}
function getBest(){return BEST;}
function setBest(v){BEST=v;localStorage.setItem('flappy_best',String(v));cloudSet('flappy_best',v);}
function getUnlocked(){const best=getBest();return SKINS.filter(s=>best>=s.unlock).map(s=>s.id);}
function getSelectedSkinId(){return SELECTED_SKIN;}
function setSelectedSkinId(id){SELECTED_SKIN=id;localStorage.setItem('flappy_skin',id);cloudSet('flappy_skin',id);}
function currentSkin(){return SKINS.find(s=>s.id===getSelectedSkinId())||SKINS[0];}
function saveRecordEntry(sc){
  if(sc<=0)return;
  RECORDS.push({score:sc,date:new Date().toLocaleDateString('ru-RU')});
  RECORDS.sort((a,b)=>b.score-a.score);RECORDS=RECORDS.slice(0,10);
  const json=JSON.stringify(RECORDS);localStorage.setItem('flappy_records',json);cloudSet('flappy_records',json);
}
function renderRecords(){
  const list=document.getElementById('recordsList');
  if(!RECORDS.length){list.innerHTML='<p style="text-align:center;color:#8a9aaa;font-weight:700;">Пока пусто — сыграй разок!</p>';return;}
  list.innerHTML=RECORDS.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 4px;font-weight:700;color:var(--ink)"><span>${i+1}. ${r.score} очков</span><span style="color:#8a9aaa;font-size:12px;">${r.date}</span></div>`).join('');
}
document.getElementById('recordsBtn').onclick=()=>{renderRecords();document.getElementById('recordsOverlay').classList.add('show');};
document.getElementById('closeRecords').onclick=()=>document.getElementById('recordsOverlay').classList.remove('show');
function renderSkinsGrid(){
  const grid=document.getElementById('skinsGrid');grid.innerHTML='';
  const unlocked=getUnlocked();
  SKINS.forEach(s=>{
    const isUnlocked=unlocked.includes(s.id);
    const div=document.createElement('div');
    div.className='skin-opt'+(isUnlocked?'':' locked')+(s.id===getSelectedSkinId()?' active':'');
    div.innerHTML=(isUnlocked?s.emoji:'❔')+`<span class="name">${s.name}</span>`+(isUnlocked?'':`<span class="lock">${s.unlock}</span>`);
    if(isUnlocked) div.onclick=()=>{setSelectedSkinId(s.id);renderSkinsGrid();};
    grid.appendChild(div);
  });
}
document.getElementById('skinBtn').onclick=()=>{renderSkinsGrid();document.getElementById('skinOverlay').classList.add('show');};
document.getElementById('closeSkins').onclick=()=>document.getElementById('skinOverlay').classList.remove('show');
const BASE_SPEED_R=0.0044,MAX_SPEED_R=0.0092,SPEED_STEP_R=0.0004,SCORE_PER_LEVEL=5;
const GRAVITY_R=0.00052,JUMP_R=-0.0135,MAX_FALL_R=0.0155,MAX_RISE_R=-0.0155;
const DARK_CYCLE=20,DARK_DURATION=5;
const NYAN_CYCLE=50,NYAN_DURATION=5;
const COUNTDOWN_TICKS=40;
let bird,pipes,score,alive,level,clouds,particles,speed;
let state='countdown';
let countdownVal=3,countdownAccum=0;
let pipeAccum=0,pipeInterval=100;
let lastTime=0;
let mode='normal';
let prevMode='normal';
let transformParticles=[],spinBoost=0;
let stars=[];
function isDarkScore(s){if(s<DARK_CYCLE)return false;return(s%DARK_CYCLE)<DARK_DURATION;}
function isNyanScore(s){if(s<NYAN_CYCLE)return false;return(s%NYAN_CYCLE)<NYAN_DURATION;}
function activeVisual(){
  if(mode==='nyan')return{emoji:'🌈',body:'#F58FB3',bodyLight:'#FFD1E6',beak:'#FF6FA6',nyan:true};
  if(mode==='dark')return{emoji:'🐦‍⬛',body:'#2b2b36',bodyLight:'#454554',beak:'#8a8a9a'};
  return currentSkin();
}
function reset(){
  resizeCanvas();
  bird={x:W*0.22,y:H/2,v:0,r:H*0.023,angle:0,wing:0};
  pipes=[];particles=[];transformParticles=[];spinBoost=0;
  score=0;alive=true;level=1;speed=BASE_SPEED_R*W;
  mode='normal';prevMode='normal';
  clouds=Array.from({length:5},(_,i)=>({x:Math.random()*W,y:H*0.08+i*H*0.11+Math.random()*20,s:0.5+Math.random()*0.7}));
  stars=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*1.6+0.4,tw:Math.random()*Math.PI*2}));
  document.getElementById('overlay').classList.remove('show');
  state='countdown';countdownVal=3;countdownAccum=0;
  pipeInterval=Math.max(1,Math.round(W*0.42));
  pipeAccum=0;lastTime=0;
  spawnPipe();
  requestAnimationFrame(loop);
}
function updateLevel(){
  const newLevel=Math.floor(score/SCORE_PER_LEVEL)+1;
  if(newLevel!==level){level=newLevel;speed=Math.min(MAX_SPEED_R*W,BASE_SPEED_R*W+(level-1)*SPEED_STEP_R*W);}
  const nowNyan=isNyanScore(score);
  const nowDark=!nowNyan&&isDarkScore(score);
  const newMode=nowNyan?'nyan':(nowDark?'dark':'normal');
  if(newMode!==mode){prevMode=mode;mode=newMode;triggerTransformFX();}
}
function triggerTransformFX(){
  spinBoost=14;const v=activeVisual();
  for(let i=0;i<26;i++){
    const ang=Math.random()*Math.PI*2;
    transformParticles.push({x:bird.x,y:bird.y,vx:Math.cos(ang)*(1+Math.random()*2.4),vy:Math.sin(ang)*(1+Math.random()*2.4),life:34,maxLife:34,color:i%2===0?(v.body||'#FFD700'):'#FFFFFF'});
  }
}
function spawnPipe(){const gap=H*0.34;const top=H*0.09+Math.random()*(H-gap-H*0.30);pipes.push({x:W+20,top,passed:false,gap});}
function pipeW(){return W*0.135;}
function groundH(){return H*0.02;}
function loop(time){
  if(state==='paused'){draw();drawPauseOverlay();return;}
  if(!lastTime)lastTime=time;
  let delta=time-lastTime;lastTime=time;
  if(delta>100)delta=100;
  const dt=delta/(1000/60);
  if(state==='countdown'){
    countdownAccum+=dt;
    while(countdownAccum>=COUNTDOWN_TICKS){countdownAccum-=COUNTDOWN_TICKS;countdownVal--;}
    if(countdownVal<0)state='playing';
    draw();requestAnimationFrame(loop);return;
  }
  if(state!=='playing')return;
  const gravity=GRAVITY_R*H,maxFall=MAX_FALL_R*H,maxRise=MAX_RISE_R*H;
  bird.v+=gravity*dt;bird.v=Math.max(maxRise,Math.min(maxFall,bird.v));bird.y+=bird.v*dt;
  const angleEase=1-Math.pow(1-0.15,dt);
  bird.angle+=((bird.v*4)-bird.angle)*angleEase;bird.wing+=0.3*dt;
  clouds.forEach(c=>{c.x-=speed*0.22*c.s*dt;if(c.x<-40){c.x=W+40;c.y=H*0.06+Math.random()*(H*0.5);}});
  stars.forEach(s=>{s.tw+=0.05*dt;});
  pipeAccum+=dt;while(pipeAccum>=pipeInterval){pipeAccum-=pipeInterval;spawnPipe();}
  const pw=pipeW();
  pipes.forEach(p=>p.x-=speed*dt);pipes=pipes.filter(p=>p.x>-pw-10);
  pipes.forEach(p=>{
    if(!p.passed&&p.x+pw<bird.x){p.passed=true;score++;updateLevel();const v=activeVisual();for(let i=0;i<10;i++)particles.push({x:bird.x,y:bird.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-1.5)*3,life:22,color:v.body||'#FFD700'});}
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+pw){if(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap)gameOver();}
  });
  particles.forEach(pt=>{pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;});particles=particles.filter(pt=>pt.life>0);
  transformParticles.forEach(pt=>{pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;const damp=Math.pow(0.94,dt);pt.vx*=damp;pt.vy*=damp;pt.life-=dt;});
  transformParticles=transformParticles.filter(pt=>pt.life>0);
  if(spinBoost>0)spinBoost-=0.6*dt;
  if(bird.y+bird.r>H-groundH()-4||bird.y-bird.r<0)gameOver();
  draw();if(state==='playing')requestAnimationFrame(loop);
}
function drawCloud(c){
  ctx.save();ctx.globalAlpha=mode==='dark'?0.1:(mode==='nyan'?0.5:0.55);ctx.fillStyle=mode==='dark'?'#6a6a7a':'#ffffff';
  ctx.beginPath();ctx.ellipse(c.x,c.y,22*c.s,12*c.s,0,0,Math.PI*2);ctx.ellipse(c.x+16*c.s,c.y+3*c.s,16*c.s,10*c.s,0,0,Math.PI*2);ctx.ellipse(c.x-16*c.s,c.y+3*c.s,14*c.s,9*c.s,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawGraveyard(){
  ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#000000';
  const n=Math.floor(W/60);
  for(let i=0;i<n;i++){const x=i*60+20;const h=26+((i*37)%18);ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,H-groundH()-h,26,h,6);else ctx.rect(x,H-groundH()-h,26,h);ctx.fill();if(i%2===0){ctx.fillRect(x+11,H-groundH()-h-14,4,14);ctx.fillRect(x+4,H-groundH()-h-8,18,4);}}
  ctx.globalAlpha=0.85;ctx.fillStyle='#cfcfe0';ctx.beginPath();ctx.arc(W-W*0.15,H*0.12,W*0.045,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawNyanBg(){
  ctx.save();stars.forEach(s=>{ctx.globalAlpha=0.5+Math.sin(s.tw)*0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  const stripes=['#FF5A5A','#FF9F4D','#FFE24D','#7BE36A','#5AB4FF','#B27BFF'];
  const trailH=bird.r*2.1;const stripeH=trailH/stripes.length;const trailLen=Math.min(bird.x-14,W*0.32);const trailStartX=Math.max(0,bird.x-14-trailLen);const waveAmp=bird.r*0.18;
  ctx.save();const fade=ctx.createLinearGradient(trailStartX,0,bird.x-14,0);fade.addColorStop(0,'rgba(255,255,255,0)');fade.addColorStop(1,'rgba(255,255,255,1)');
  stripes.forEach((col,i)=>{ctx.fillStyle=col;const wave=Math.sin(Date.now()/140+i)*waveAmp;ctx.fillRect(trailStartX,bird.y-trailH/2+i*stripeH+wave,trailLen+14,stripeH+0.6);});
  ctx.globalCompositeOperation='destination-in';ctx.fillStyle=fade;ctx.fillRect(trailStartX,bird.y-trailH/2-waveAmp,trailLen+14,trailH+waveAmp*2);ctx.globalCompositeOperation='source-over';ctx.restore();
  for(let i=0;i<5;i++){const t=(Date.now()/300+i*0.7)%1;const sx=bird.x-14-trailLen*t;const sy=bird.y+Math.sin(Date.now()/160+i*2)*trailH*0.4;ctx.globalAlpha=1-t;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,1.6,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
}
function drawPipe(p){
  const pw=pipeW();let c1,c2,cDark;
  if(mode==='dark'){c1='#3a3a46';c2='#55556a';cDark='#22222c';}
  else if(mode==='nyan'){c1='#B27BFF';c2='#E0BFFF';cDark='#7B4FBF';}
  else{c1='#2FAE6C';c2='#4DDB94';cDark='#268A56';}
  const grad=ctx.createLinearGradient(p.x,0,p.x+pw,0);grad.addColorStop(0,c1);grad.addColorStop(0.5,c2);grad.addColorStop(1,c1);ctx.fillStyle=grad;
  ctx.fillRect(p.x,0,pw,p.top);ctx.fillRect(p.x,p.top+p.gap,pw,H-(p.top+p.gap));
  ctx.fillStyle=cDark;ctx.fillRect(p.x-4,p.top-18,pw+8,18);ctx.fillRect(p.x-4,p.top+p.gap,pw+8,18);
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(p.x+6,0,8,p.top);ctx.fillRect(p.x+6,p.top+p.gap+18,8,H-(p.top+p.gap+18));
}
function drawBird(){
  const v=activeVisual();ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate((bird.angle+spinBoost*8)*Math.PI/180);
  if(v.nyan){
    const s=bird.r;ctx.fillStyle='#D9A066';ctx.fillRect(-s*1.4,-s*0.7,s*2.6,s*1.4);ctx.fillStyle='#FFB3D1';ctx.fillRect(-s*1.4,-s*0.7,s*2.6,s*0.5);
    ctx.fillStyle='#7C5A3A';ctx.beginPath();ctx.moveTo(-s*1.1,-s*0.7);ctx.lineTo(-s*0.8,-s*1.4);ctx.lineTo(-s*0.5,-s*0.7);ctx.fill();ctx.beginPath();ctx.moveTo(s*0.5,-s*0.7);ctx.lineTo(s*0.8,-s*1.4);ctx.lineTo(s*1.1,-s*0.7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*1.1,-s*0.05,3.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1E4635';ctx.beginPath();ctx.arc(s*1.3,-s*0.05,1.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF9EC4';ctx.beginPath();ctx.arc(0,s*0.05,2.2,0,Math.PI*2);ctx.fill();
  }else{
    const grad=ctx.createRadialGradient(-4,-4,2,0,0,bird.r+2);grad.addColorStop(0,v.bodyLight||'#FFE29A');grad.addColorStop(1,v.body||'#FFC94D');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,bird.r+2,bird.r,0,0,Math.PI*2);ctx.fill();
    const wingY=Math.sin(bird.wing)*bird.r*0.4;ctx.fillStyle=v.beak||'#FF8A3D';ctx.beginPath();ctx.ellipse(-bird.r*0.3,wingY,bird.r*0.6,bird.r*0.4,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-bird.r-1,-2);ctx.lineTo(-bird.r-bird.r*0.6,-6);ctx.lineTo(-bird.r-bird.r*0.6,4);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(bird.r-3,-2);ctx.lineTo(bird.r+bird.r*0.6,1);ctx.lineTo(bird.r-3,5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bird.r*0.35,-bird.r*0.35,bird.r*0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=mode==='dark'?'#e04040':'#1E4635';ctx.beginPath();ctx.arc(bird.r*0.45,-bird.r*0.35,bird.r*0.14,0,Math.PI*2);ctx.fill();
    if(v.extra==='crow'){ctx.save();ctx.globalAlpha=0.35;ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,bird.r+7,bird.r+5,0,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.fillStyle='#B24040';ctx.beginPath();ctx.arc(bird.r*0.45,-bird.r*0.35,bird.r*0.14,0,Math.PI*2);ctx.fill();}
    if(v.extra==='sigma'){ctx.fillStyle='#151515';ctx.fillRect(-bird.r*0.15,-bird.r*0.55,bird.r*0.95,bird.r*0.32);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(-bird.r*0.1,-bird.r*0.5,bird.r*0.3,bird.r*0.1);ctx.strokeStyle='#D4AF37';ctx.lineWidth=1.6;ctx.beginPath();for(let i=0;i<4;i++){ctx.moveTo(-bird.r*0.4+i*3,bird.r*0.55);ctx.lineTo(-bird.r*0.4+i*3+2,bird.r*0.62);}ctx.stroke();}
    if(v.extra==='crylaugh'){ctx.fillStyle='#4FB8E8';ctx.beginPath();ctx.moveTo(bird.r*0.35,bird.r*0.05);ctx.quadraticCurveTo(bird.r*0.5,bird.r*0.3,bird.r*0.35,bird.r*0.45);ctx.quadraticCurveTo(bird.r*0.2,bird.r*0.3,bird.r*0.35,bird.r*0.05);ctx.fill();ctx.strokeStyle='#B5680C';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.arc(bird.r*0.05,bird.r*0.35,bird.r*0.32,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
    if(v.extra==='gigachad'){ctx.fillStyle=v.bodyLight;ctx.beginPath();ctx.moveTo(-bird.r*0.5,bird.r*0.5);ctx.lineTo(bird.r*0.6,bird.r*0.55);ctx.lineTo(bird.r*0.15,bird.r*0.95);ctx.lineTo(-bird.r*0.2,bird.r*0.75);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(bird.r*0.15,bird.r*0.6);ctx.lineTo(bird.r*0.1,bird.r*0.9);ctx.stroke();}
  }
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const skinBg=currentSkin().sky;const sky=ctx.createLinearGradient(0,0,0,H);
  if(mode==='dark'){sky.addColorStop(0,'#15121e');sky.addColorStop(1,'#26202f');}
  else if(mode==='nyan'){sky.addColorStop(0,'#1b1440');sky.addColorStop(1,'#3a2a6b');}
  else{sky.addColorStop(0,skinBg[0]);sky.addColorStop(1,skinBg[1]);}
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  if(mode==='nyan')drawNyanBg();
  clouds.forEach(drawCloud);
  if(mode==='dark')drawGraveyard();
  pipes.forEach(drawPipe);
  particles.forEach(pt=>{ctx.globalAlpha=Math.max(0,pt.life/22);ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
  transformParticles.forEach(pt=>{ctx.globalAlpha=Math.max(0,pt.life/pt.maxLife);ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(pt.x,pt.y,3.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
  ctx.fillStyle=mode==='dark'?'#1a1a22':'#B98E4E';ctx.fillRect(0,H-groundH(),W,groundH());
  ctx.fillStyle=mode==='dark'?'#0f0f14':'#8FE070';ctx.fillRect(0,H-groundH()-3,W,3);
  drawBird();
  // Счёт — Russo One в стиле меню
  ctx.fillStyle=mode==='dark'||mode==='nyan'?'#f5f0ff':'#f6e8bd';
  ctx.strokeStyle=mode==='dark'||mode==='nyan'?'#000':'#14202b';ctx.lineWidth=3;
  ctx.font='bold '+(H*0.06)+'px "Russo One",sans-serif';ctx.textAlign='center';
  ctx.strokeText(score,W/2,H*0.1);ctx.fillText(score,W/2,H*0.1);
  ctx.font=(H*0.028)+'px "Rubik",sans-serif';ctx.fillStyle=mode==='dark'||mode==='nyan'?'rgba(245,240,255,0.7)':'rgba(246,232,189,0.8)';
  ctx.fillText('Уровень '+level,W/2,H*0.14);
  if(state==='countdown'){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f6e8bd';ctx.font='bold '+(H*0.14)+'px "Russo One",sans-serif';ctx.textAlign='center';
    ctx.fillText(countdownVal>0?countdownVal:'Лети!',W/2,H/2+20);
  }
}
function gameOver(){
  if(!alive)return;alive=false;state='over';
  const best=getBest();const wasNewBest=score>best;
  if(wasNewBest)setBest(score);saveRecordEntry(score);
  document.getElementById('overTitle').textContent=wasNewBest?'Новый рекорд! 🏆':'Игра окончена 🪶';
  document.getElementById('finalScore').textContent='Счёт: '+score;
  document.getElementById('bestScore').textContent='Рекорд: '+getBest();
  document.getElementById('overlay').classList.add('show');
}
function flap(){if(state==='playing')bird.v=JUMP_R*H;}
let lastFlapTouchAt=0;
canvas.addEventListener('touchstart',e=>{e.preventDefault();lastFlapTouchAt=Date.now();flap();},{passive:false});
canvas.addEventListener('mousedown',()=>{if(Date.now()-lastFlapTouchAt<700)return;flap();});
document.addEventListener('keydown',e=>{if(e.code==='Space')flap();});
document.getElementById('restart').onclick=reset;
document.getElementById('pauseBtn').onclick=()=>{
  if(state==='playing'){state='paused';}
  else if(state==='paused'){state='countdown';countdownVal=3;countdownAccum=0;lastTime=0;requestAnimationFrame(loop);}
};
function drawPauseOverlay(){
  ctx.fillStyle='rgba(8,17,29,0.65)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f3bc37';ctx.font='bold '+(H*0.07)+'px "Russo One",sans-serif';ctx.textAlign='center';
  ctx.shadowColor='#f3bc37';ctx.shadowBlur=12;ctx.fillText('ПАУЗА',W/2,H/2);ctx.shadowBlur=0;
  ctx.fillStyle='rgba(246,232,189,0.7)';ctx.font=(H*0.024)+'px "Rubik",sans-serif';
  ctx.fillText('Нажми на паузу ещё раз',W/2,H/2+H*0.05);
}
function boot(){loadUserData().catch(()=>{}).then(()=>reset());}
if(document.readyState==='complete'||document.readyState==='interactive') boot();
else window.addEventListener('DOMContentLoaded',boot);
</script>
